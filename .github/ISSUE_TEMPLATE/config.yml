# GitHub is roughly 60% disrupted from mainland China, and every contributor is
# in Beijing. These fallbacks are not a courtesy — for most of the cohort most
# of the time, they are the only route in. Keep them at the top.
blank_issues_enabled: true
contact_links:
  - name: GitHub not loading? Send it to us any way you like
    url: https://github.com/how-to-fl/how-to-fl.github.io/blob/main/CONTRIBUTING.md#if-github-wont-load
    about: WeChat, email, or bring it to the next session. One of us will type it in for you.

  - name: Come to a contribution session
    url: https://github.com/how-to-fl/how-to-fl.github.io/blob/main/CONTRIBUTING.md#contribution-sessions
    about: Ninety minutes, pizza, everyone adds three places and a paragraph. Easiest way to pitch in.
