name: Something here is wrong or out of date
description: A place that's closed, a visa rule that's changed, a broken link, a recommendation that's gone downhill.
title: "[fix] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections are genuinely the most useful thing you can send us. A guide people
        trust beats a guide that's merely thorough — and it only stays trustworthy because
        people like you tell us when it's gone stale.

  - type: input
    id: where
    attributes:
      label: Which page or place?
      description: A link, or just the page name.
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What's wrong with it?
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: What should it say instead?
      description: If you know. If you don't, just say so — flagging it is already plenty.

  - type: input
    id: when
    attributes:
      label: When did you check?
      placeholder: 2026-08
