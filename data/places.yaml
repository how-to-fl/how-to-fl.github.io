  # ── Cohort 6's city list, added 2026-08 ────────────────────────────────────
  #
  # Coordinates here are solid. Each one came from the place's own Amap entry,
  # which is GCJ-02, and was converted to WGS-84 with the same transform
  # BeijingMap.astro uses, run backwards. The offset removed is about 550 m, a
  # round-trip reproduces Amap's original to under a metre, and two of them
  # (Cafe Zarah, Great Leap Brewing) land on their own OSM entries as a check.
  #
  # Two fields are weaker than the rest of this file, and you should know which:
  #
  #   name_zh    — only 大跃啤酒, 唱吧麦颂, 全聚德 and 油梨树 are genuinely the
  #                Chinese names. For the other 34 this repeats the name the
  #                place is listed under on Amap, which for most of these bars
  #                really is the Latin one. It is not a translation, and it has
  #                not been invented either — replace it as you learn the real
  #                one.
  #   address_zh — 11 of the 38 carry a door number. Those were built from two
  #                sourced halves and only where both agree: the Chinese road
  #                name from OSM, and the street number from the original
  #                listing, kept only when reverse-geocoding the same point in
  #                English returned the same road. Where the two disagreed, or
  #                where the listing's number was a unit or a floor rather than
  #                a street number (Alimentari's "No.12-13", Slow Boat's 51
  #                belonging to Di'anmen Street and not the Hehua market), the
  #                address stays at street level rather than being guessed —
  #                a confidently wrong door number is worse than a vague one.
  #                The pin itself is exact either way, and the popup's "Open in
  #                Amap" goes to the precise point, so navigation works; it is
  #                only the copy-for-a-driver button that is coarser on the
  #                other 27.
  #
  # The door detail that was in the English listing lives in `note`, so it is
  # still on the page for anyone standing outside looking for the entrance.

